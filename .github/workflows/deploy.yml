name: Build & Push & Deploy Client Image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/journey:latest .

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/journey:latest

      - name: Copy Files to On-Prem Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,nginx/**"
          target: /Users/${{ secrets.SERVER_USER }}/journey/deploy

      - name: Pull Latest Images and Restart Containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            DOCKER_PATH=/usr/local/bin/docker
            cd /Users/${{ secrets.SERVER_USER }}/journey/deploy
            echo ${{ secrets.GITHUB_TOKEN }} | $DOCKER_PATH login ghcr.io -u ${{ github.actor }} --password-stdin
            $DOCKER_PATH compose pull
            $DOCKER_PATH compose up -d --remove-orphans
